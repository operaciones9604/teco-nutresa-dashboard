<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Operativo — TECO S.A.S. | Nutresa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teco:#000090;--teco-c:#26C6DA;--teco-cl:rgba(38,198,218,0.10);--teco-dl:rgba(0,0,144,0.06);
  --bg:#f5f5f7;--card:#ffffff;--border:#e0e0e0;--text:#1a1a1a;--muted:#666;--light:#f0f0f2;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
/* HEADER */
.header{background:var(--teco);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.hdr-left{display:flex;align-items:center;gap:14px}
.logo-box{background:white;border-radius:8px;padding:6px 10px;height:52px;display:flex;align-items:center}
.logo-box img{height:38px;width:auto}
.hdr-titles .sup{font-size:10px;color:rgba(255,255,255,0.55);margin-bottom:2px}
.hdr-titles .main{font-size:15px;font-weight:500;color:white}
.hdr-date{font-size:10px;color:rgba(255,255,255,0.45);margin-top:4px}
/* TABS */
.tab-bar{background:white;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0;overflow-x:auto}
.tab{padding:12px 18px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s}
.tab.active{color:var(--teco);border-bottom-color:var(--teco)}
.tab:hover:not(.active){color:var(--text)}
/* VIEWS */
.view{display:none;padding:20px 24px;max-width:1100px;margin:0 auto}
.view.active{display:block}
/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi.hl{border-color:var(--teco-c);border-width:1.5px}
.kpi .lbl{font-size:10px;color:var(--muted);margin-bottom:4px}
.kpi .val{font-size:20px;font-weight:500}
.val.ok{color:#1D9E75}.val.warn{color:#BA7517}.val.fail{color:#E24B4A}.val.blue{color:var(--teco)}.val.cyan{color:#0097A7}
/* SECTION TITLE */
.sec{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin:1rem 0 7px}
.subsec{font-size:11px;font-weight:500;color:var(--muted);margin:8px 0 5px;padding-left:8px;border-left:2px solid var(--border)}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.card-title{font-size:13px;font-weight:500}
.card-sub{font-size:10px;color:var(--muted)}
.card-date{font-size:10px;color:var(--muted);background:var(--light);padding:2px 8px;border-radius:20px}
/* POINT GRID */
.point-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:1rem}
.point-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.point-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.point-title.reactor{color:var(--teco)}
.pp{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pp-name{font-size:11px;color:var(--muted)}
.pp-val{font-size:12px;font-weight:500}
.pp-val.ok{color:#1D9E75}.pp-val.warn{color:#BA7517}.pp-val.fail{color:#E24B4A}.pp-val.na{color:#bbb}
.aspect-tag{font-size:10px;padding:2px 8px;background:var(--light);border-radius:20px;color:var(--muted)}
/* STATUS ROW */
.st-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.st-pill{text-align:center;padding:7px 4px;border-radius:8px;background:var(--light)}
.st-pill .n{font-size:18px;font-weight:500}
.st-pill .l{font-size:10px;color:var(--muted);margin-top:1px}
/* PARAM LIST */
.plist{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-radius:6px}
.prow.ok{background:rgba(0,0,144,0.04)}.prow.warn{background:rgba(186,117,23,0.07)}.prow.fail{background:rgba(226,75,74,0.07)}
.plbl{font-size:11px;color:var(--muted)}
.pright{display:flex;align-items:center;gap:6px}
.pval{font-size:12px;font-weight:500}
.pval.ok{color:#1D9E75}.pval.warn{color:#BA7517}.pval.fail{color:#E24B4A}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.ok{background:#1D9E75}.dot.warn{background:#BA7517}.dot.fail{background:#E24B4A}
/* CHART */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.chart-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.chart-ttl{font-size:13px;font-weight:500}
.chart-sel{font-size:11px;border:1px solid var(--border);border-radius:6px;padding:4px 8px;background:var(--light);color:var(--text);cursor:pointer}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:3px}
.ld{width:10px;height:3px;border-radius:2px;display:inline-block}
/* ALERTS */
.alert-box{background:var(--light);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.alert-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.alert-hdr-lbl{font-size:11px;font-weight:500;color:var(--muted)}
.alert-item{font-size:11px;padding:5px 8px;border-radius:6px;margin-bottom:3px;border-left:3px solid}
.alert-item.fail{background:rgba(226,75,74,0.07);border-color:#E24B4A}
.alert-item.warn{background:rgba(186,117,23,0.07);border-color:#BA7517}
.alert-ta{width:100%;font-size:11px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:white;color:var(--text);resize:vertical;margin-top:6px;min-height:55px;font-family:inherit}
/* FORM */
.form-block{background:var(--light);border-radius:8px;padding:12px;margin-top:8px}
.form-grid{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:8px}
.form-grid label{font-size:10px;color:var(--muted);margin-bottom:2px;display:block}
.form-grid input,.form-grid select{width:100%;font-size:11px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:white;color:var(--text)}
.form-full{margin-bottom:7px}
.form-full label{font-size:10px;color:var(--muted);margin-bottom:2px;display:block}
.form-full textarea{width:100%;font-size:11px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:white;color:var(--text);resize:vertical;min-height:45px;font-family:inherit}
.btn{padding:6px 16px;background:var(--teco);color:white;border:none;border-radius:6px;font-size:11px;cursor:pointer;margin-top:2px}
.btn:hover{opacity:.88}
.btn-sm{padding:4px 10px;background:transparent;border:1px solid var(--border);border-radius:6px;font-size:10px;cursor:pointer;color:var(--muted)}
.btn-sm:hover{background:var(--light)}
/* COUNTER */
.counter-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:8px}
.c-stat{background:var(--light);border-radius:8px;padding:8px 10px}
.c-stat .l{font-size:10px;color:var(--muted);margin-bottom:1px}
.c-stat .v{font-size:15px;font-weight:500;color:var(--teco)}
/* VOL ROW */
.vrow{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:var(--teco-cl);border-radius:6px;margin-bottom:3px}
.vlbl{font-size:11px;color:var(--muted)}
.vval{font-size:13px;font-weight:500;color:var(--teco)}
/* MES TABS */
.mes-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mes-tab{font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);cursor:pointer}
.mes-tab.active{background:var(--teco);color:white;border-color:var(--teco)}
/* LAB */
.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px;margin-bottom:1rem}
.lab-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.lab-param{font-size:11px;font-weight:500;color:var(--muted);margin-bottom:5px}
.lab-pt{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
.lab-pt-lbl{color:var(--muted)}
.lab-pt-val{font-weight:500}
.lab-pt-val.ok{color:#1D9E75}.lab-pt-val.warn{color:#BA7517}.lab-pt-val.fail{color:#E24B4A}
/* INV TABLE */
.inv-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem}
.inv-table{width:100%;border-collapse:collapse;font-size:12px}
.inv-table th{background:var(--light);padding:8px 10px;font-weight:500;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border)}
.inv-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.inv-table tr:last-child td{border-bottom:none}
.inv-table td.r{text-align:right}
.inv-table th.r{text-align:right}
.fin-val{font-weight:500;color:var(--teco)}
.fin-val.warn{color:#BA7517}.fin-val.fail{color:#E24B4A}
.stock-bar-bg{flex:1;background:var(--border);border-radius:3px;height:4px;overflow:hidden;min-width:40px}
.stock-bar-fill{height:4px;border-radius:3px}
.stock-mini{display:flex;align-items:center;gap:5px}
.conc-inp{width:55px;font-size:11px;padding:3px 5px;border:1px solid var(--border);border-radius:5px;background:var(--light);color:var(--text);text-align:center}
/* NOV */
.nov-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fbtn{font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);cursor:pointer}
.fbtn.active{background:var(--teco);color:white;border-color:var(--teco)}
.nov-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:7px}
.nov-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-falla{background:#FCEBEB;color:#A32D2D}.badge-visita{background:#E6F1FB;color:#185FA5}.badge-obs{background:#EAF3DE;color:#3B6D11}
.badge-abierta{background:#FCEBEB;color:#A32D2D}.badge-proceso{background:#FAEEDA;color:#854F0B}.badge-cerrada{background:#EAF3DE;color:#3B6D11}
.badge-ptap{background:#E1F5EE;color:#0F6E56}.badge-ptard{background:#E6F1FB;color:#185FA5}
.nov-date{font-size:10px;color:var(--muted)}
.nov-desc{font-size:12px;margin-bottom:3px}
.nov-acc{font-size:11px;color:var(--muted)}
/* GENERAL */
.plant-grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:1.25rem}
.divider{height:1px;background:var(--border);margin:8px 0}

/* FILTROS MES/AÑO */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.filter-bar label{font-size:11px;color:var(--muted);font-weight:500}
.filter-bar select{font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--light);color:var(--text);cursor:pointer}
.filter-bar .btn-clear{font-size:11px;padding:4px 10px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer}
.filter-bar .btn-clear:hover{background:var(--light)}
/* CONSOLIDADO MENSUAL QUIMICOS */
.consol-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:1rem}
.consol-table th{background:var(--teco);color:white;padding:8px 10px;font-size:10px;font-weight:500;text-align:left}
.consol-table th.r{text-align:right}
.consol-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.consol-table td.r{text-align:right;font-weight:500}
.consol-table tr:last-child td{border-bottom:none}
.consol-table tr.total{background:rgba(0,0,144,0.04);font-weight:600}

/* FOOTER */
.footer{background:var(--teco-dl);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;margin-top:10px}
.footer span{font-size:10px;color:var(--muted)}
.footer strong{color:var(--teco)}
/* CONN STATUS */
.conn-banner{padding:8px 14px;border-radius:8px;font-size:11px;margin-bottom:10px;display:none}
.conn-banner.show{display:block}
.conn-banner.ok{background:#EAF3DE;color:#3B6D11}
.conn-banner.err{background:#FCEBEB;color:#A32D2D}
.conn-banner.loading{background:#E6F1FB;color:#185FA5}
</style>
</head>

// ═══════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════
function gs(v,lim) {
  if(v===null||v===undefined||v==='') return 'na';
  if(lim.max===0&&v>0) return 'fail';
  if(lim.max!==undefined&&v>lim.max) return 'fail';
  if(lim.min!==undefined&&v<lim.min) return 'fail';
  if(lim.max!==undefined&&lim.max>0&&v>lim.max*0.85) return 'warn';
  return 'ok';
}
function fmt(v,d=2) { if(v===null||v===undefined||v==='') return '—'; return typeof v==='number'?parseFloat(v.toFixed(d)):v; }
function dc(id) { if(charts[id]) { charts[id].destroy(); delete charts[id]; } }
function ts() { document.getElementById('hdr-date').textContent = 'Actualizado: '+new Date().toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}); }
function copyEl(id) {
  const ta=document.getElementById(id); if(!ta||!ta.value.trim()) return;
  navigator.clipboard.writeText(ta.value).then(()=>{
    const btn=event.target.closest('button'); const orig=btn.textContent;
    btn.textContent='✓ Copiado'; setTimeout(()=>btn.textContent=orig,2000);
  });
}
function alertsBox(editId, alerts) {
  let h=`<div class="alert-box"><div class="alert-hdr"><span class="alert-hdr-lbl">⚠ Alertas automáticas</span><button class="btn-sm" onclick="copyEl('${editId}')">Copiar</button></div>`;
  if(alerts.length) {
    alerts.forEach(a=>{ h+=`<div class="alert-item ${a.level}">${a.text}</div>`; });
    h+=`<textarea class="alert-ta" id="${editId}">${alerts.map(a=>a.text).join('\n')}</textarea>`;
  } else {
    h+=`<div style="font-size:11px;color:#999">Sin alertas en el último registro.</div>`;
    h+=`<textarea class="alert-ta" id="${editId}" placeholder="Agrega observaciones para el informe..."></textarea>`;
  }
  return h+'</div>';
}

// ═══════════════════════════════════════════════════════════════════
// CARGA DESDE GOOGLE SHEETS
// ═══════════════════════════════════════════════════════════════════
async function loadFromSheets() {
  if(!USE_SHEETS) return;
  const keys = Object.keys(SHEETS_URLS);
  for(const key of keys) {
    const url = SHEETS_URLS[key];
    if(!url) continue;
    try {
      const r = await fetch(url);
      const text = await r.text();
      const rows = text.trim().split('\n').map(l=>l.split(','));
      const headers = rows[0].map(h=>h.trim().replace(/"/g,''));
      const data = rows.slice(1).map(row=>{
        const obj={};
        headers.forEach((h,i)=>{ const v=row[i]?row[i].trim().replace(/"/g,''):''; obj[h]=isNaN(v)||v===''?v:parseFloat(v); });
        return obj;
      });
      state[key] = data;
    } catch(e) { console.warn('Error cargando '+key, e); }
  }
  renderAll();
}


// ═══════════════════════════════════════════════════════════════════
// FILTROS MES / AÑO
// ═══════════════════════════════════════════════════════════════════
function getMesesFromData(data) {
  return [...new Set(data.map(r=>(r.date||r.mes||'').slice(0,7)).filter(Boolean))].sort();
}
function getAniosFromData(data) {
  return [...new Set(data.map(r=>(r.date||r.mes||'').slice(0,4)).filter(Boolean))].sort();
}
function filterData(data, mes, anio) {
  return data.filter(r=>{
    const d = r.date||r.mes||'';
    if(anio && !d.startsWith(anio)) return false;
    if(mes && !d.startsWith(mes)) return false;
    return true;
  });
}
function filterBarHTML(id, data, onchange) {
  const meses = getMesesFromData(data);
  const anios = getAniosFromData(data);
  return `<div class="filter-bar">
    <label>Año:</label>
    <select id="fil-anio-${id}" onchange="${onchange}">
      <option value="">Todos</option>
      ${anios.map(a=>`<option value="${a}" ${filterAnio===a?'selected':''}>${a}</option>`).join('')}
    </select>
    <label>Mes:</label>
    <select id="fil-mes-${id}" onchange="${onchange}">
      <option value="">Todos</option>
      ${meses.map(m=>`<option value="${m}" ${filterMes===m?'selected':''}>${m}</option>`).join('')}
    </select>
    <button class="btn-clear" onclick="clearFilters('${id}','${onchange}')">Limpiar</button>
    <span style="font-size:10px;color:var(--muted);margin-left:4px">${filterData(data,filterMes,filterAnio).length} registros</span>
  </div>`;
}
function applyFilter(id) {
  const a = document.getElementById('fil-anio-'+id);
  const m = document.getElementById('fil-mes-'+id);
  if(a) filterAnio = a.value;
  if(m) filterMes = m.value;
}
function clearFilters(id, onchange) {
  filterMes=''; filterAnio='';
  const a=document.getElementById('fil-anio-'+id); if(a) a.value='';
  const m=document.getElementById('fil-mes-'+id); if(m) m.value='';
  eval(onchange.replace('()','()'));
}

  const al=[];
  ch.forEach(c=>{const v=last[c.k];if(v===null||v===undefined)return;if(v>c.max)al.push({level:'fail',text:`${c.l} en incumplimiento: ${fmt(v,2)} (límite: ${c.min}–${c.max}).`});else if(v<c.min)al.push({level:'fail',text:`${c.l} por debajo del mínimo: ${fmt(v,2)} (mín: ${c.min}).`});else if(c.max&&v>c.max*0.88)al.push({level:'warn',text:`${c.l} en precaución: ${fmt(v,2)}.`});});

}

  else if(last.sal_DQO>170) al.push({level:'warn',text:`DQO salida en precaución: ${fmt(last.sal_DQO,0)} mg/L (límite: ≤200 mg/L).`});
  if(last.sal_ssed>10) al.push({level:'fail',text:`Sólidos sedimentables salida: ${fmt(last.sal_ssed,1)} mL/L·h (límite: ≤10 mL/L·h).`});
  if(last.lm_OD!==null&&last.lm_OD<1.0) al.push({level:'fail',text:`OD licor mezclado bajo: ${fmt(last.lm_OD,2)} mg/L (mínimo recomendado: 1.0 mg/L).`});
  if(last.sal_pH<6.0||last.sal_pH>9.0) al.push({level:'fail',text:`pH salida fuera de rango: ${fmt(last.sal_pH,2)} (límite: 6.0–9.0).`});
  const ef=last.ent_DQO&&last.sal_DQO?Math.round((1-last.sal_DQO/last.ent_DQO)*100):null;
  if(ef!==null&&ef<40) al.push({level:'warn',text:`Eficiencia DQO baja: ${ef}%. Revisar condiciones del reactor biológico.`});
  return al;
}
function drawPtardChart(param){
  dc('chart-ptard'); const c=document.getElementById('chart-ptard'); if(!c) return;
  const datosRG=filterData(state.ptard,filterMes,filterAnio);
  const labels=datosRG.map(r=>r.date);
  const cfgs={
    dqo:{s:[{k:'ent_DQO',l:'DQO entrada',c:'#000090'},{k:'sal_DQO',l:'DQO salida',c:'#1D9E75'}],lim:{max:200,c:'#E24B4A'}},
    pH:{s:[{k:'ent_pH',l:'pH entrada',c:'#000090'},{k:'sal_pH',l:'pH salida',c:'#1D9E75'}],lim:{min:6.0,max:9.0,c:'#BA7517'}},
    ssed:{s:[{k:'sal_ssed',l:'Sólidos sed.',c:'#534AB7'}],lim:{max:10,c:'#E24B4A'}},
    caudal:{s:[{k:'ent_caudal',l:'Caudal entrada',c:'#000090'},{k:'sal_caudal',l:'Caudal salida',c:'#1D9E75'}],lim:null},
    OD:{s:[{k:'lm_OD',l:'OD licor',c:'#534AB7'}],lim:{min:1.0,c:'#BA7517'}},
    horas:{s:[{k:'horas_op',l:'Horas operación',c:'#000090'}],lim:null},
  };
  const cfg=cfgs[param]||cfgs.dqo;
  const leg=document.getElementById('r-legend');
  if(leg) leg.innerHTML=cfg.s.map(s=>`<span><span class="ld" style="background:${s.c}"></span>${s.l}</span>`).join('');
  const ds=cfg.s.map(s=>({label:s.l,data:datosRG.map(r=>r[s.k]??null),borderColor:s.c,backgroundColor:s.c+'15',pointRadius:4,tension:0.3,borderWidth:2,fill:false}));
  if(cfg.lim?.max) ds.push({label:'Límite',data:labels.map(()=>cfg.lim.max),borderColor:cfg.lim.c,borderDash:[5,3],borderWidth:1.5,pointRadius:0,fill:false});
  if(cfg.lim?.min) ds.push({label:'Mín',data:labels.map(()=>cfg.lim.min),borderColor:cfg.lim.c,borderDash:[5,3],borderWidth:1.5,pointRadius:0,fill:false});
  charts['chart-ptard']=new Chart(c,{type:'line',data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10},maxRotation:30,autoSkip:false},grid:{color:'rgba(0,0,0,0.04)'}},y:{ticks:{font:{size:10}}}}}});
}
function savePtard(){
  const dv=document.getElementById('pd-date').value; if(!dv){alert('Ingresa fecha.');return;}
  const g=id=>{const el=document.getElementById(id);return el&&el.value!==''?parseFloat(el.value):null;};
  const gt=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  state.ptard.push({date:dv,ent_pH:g('pd-eph'),ent_caudal:g('pd-ecq'),ent_DQO:g('pd-edqo'),sal_pH:g('pd-sph'),sal_caudal:g('pd-scq'),sal_DQO:g('pd-sdqo'),sal_cloro:g('pd-scl'),sal_ssed:g('pd-ssed'),horas_op:g('pd-horas'),lm_ssed:g('pd-lssed'),lm_OD:g('pd-lod'),lm_pH:g('pd-lph'),lm_aspecto:gt('pd-lasp')});
  state.ptard.sort((a,b)=>a.date.localeCompare(b.date));
  renderPtard(); renderGeneral(); ts();
}

function renderQuimicos(){
  applyFilter('quim');
  const cont=document.getElementById('view-quimicos');
  const datosQ=filterData(state.quimicos,filterMes,filterAnio);
  
  // ── Consolidado mensual ──────────────────────────────────────────
  const mesesQ=[...new Set(state.quimicos.map(r=>r.date.slice(0,7)))].sort();
  const mesActualQ=filterMes||mesesQ[mesesQ.length-1]||'';
  const registrosMes=state.quimicos.filter(r=>r.date.startsWith(mesActualQ));
  
  let consol={};
  registrosMes.forEach(r=>{
    const k=r.planta+'_'+r.quimico;
    if(!consol[k]) consol[k]={planta:r.planta,quimico:r.quimico,unidad:r.unidad||'',totalSale:0,totalCosto:0,totalM3:0,dias:0};
    consol[k].totalSale+=parseFloat(r.sale)||0;
    consol[k].totalCosto+=(parseFloat(r.sale)||0)*(parseFloat(r.costo_unit)||0);
    consol[k].totalM3+=parseFloat(r.caudal_m3)||0;
    consol[k].dias++;
  });
  
  let consolRows='';
  let gtCosto=0,gtM3=0;
  Object.values(consol).forEach(c=>{
    const cm3=c.totalM3>0?Math.round(c.totalCosto/c.totalM3):0;
    gtCosto+=c.totalCosto; gtM3+=c.totalM3;
    consolRows+=`<tr><td>${c.planta}</td><td>${c.quimico}</td><td class="r">${parseFloat(c.totalSale.toFixed(1)).toLocaleString('es-CO')}</td><td class="r">${Math.round(c.totalCosto).toLocaleString('es-CO')}</td><td class="r">${cm3.toLocaleString('es-CO')}</td></tr>`;
  });
  if(consolRows){
    consolRows+=`<tr class="total"><td colspan="2">TOTAL</td><td class="r">—</td><td class="r">${Math.round(gtCosto).toLocaleString('es-CO')}</td><td class="r">${gtM3>0?Math.round(gtCosto/gtM3).toLocaleString('es-CO'):'—'}</td></tr>`;
  }

  let h=filterBarHTML('quim',state.quimicos,"renderQuimicos()");
  h+=`<div class="sec">Consolidado mensual — ${mesActualQ||'sin datos'}</div>`;
  h+=`<div class="inv-wrap"><table class="consol-table">
    <thead><tr><th>Planta</th><th>Químico</th><th class="r">Total consumido</th><th class="r">Costo total (COP)</th><th class="r">COP/m³</th></tr></thead>
    <tbody>${consolRows||'<tr><td colspan="5" style="text-align:center;color:#bbb;padding:12px">Sin registros para este mes</td></tr>'}</tbody>
  </table></div>`;
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">`;
  ['PTAP','PTARD'].forEach(planta=>{
    const quims=QUIMICOS_DEF[planta];
    let costoTotal=0, caudal_ref=0;
    quims.forEach(q=>{
      const rows=state.quimicos.filter(r=>r.planta===planta&&r.quimico===q.id);
      const last=rows.length?rows[rows.length-1]:null;
      if(last){costoTotal+=last.sale*last.costo_unit;caudal_ref=last.caudal_m3||caudal_ref;}
    });
    const costoM3=caudal_ref?costoTotal/caudal_ref:0;
    h+=`<div>
    <div class="sec">${planta}</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi hl"><div class="lbl">Costo hoy (COP)</div><div class="val cyan">${Math.round(costoTotal).toLocaleString('es-CO')}</div></div>
      <div class="kpi hl"><div class="lbl">COP/m³</div><div class="val cyan">${caudal_ref?Math.round(costoM3).toLocaleString('es-CO'):'—'}</div></div>
      <div class="kpi"><div class="lbl">Caudal (m³/d)</div><div class="val">${caudal_ref||'—'}</div></div>
    </div>
    <div class="inv-wrap"><table class="inv-table">
      <thead><tr><th>Químico</th><th class="r">Inicial</th><th class="r">Sale</th><th class="r">Ingresa</th><th class="r">Final</th><th class="r">Stock</th><th class="r">Conc%</th><th class="r">Dosis mg/L</th><th class="r">COP/m³</th></tr></thead>
      <tbody>`;
    quims.forEach(q=>{
      const rows=state.quimicos.filter(r=>r.planta===planta&&r.quimico===q.id);
      const last=rows.length?rows[rows.length-1]:null;
      if(!last){h+=`<tr><td><strong>${q.id}</strong><br><span style="font-size:10px;color:#999">${q.unit}</span></td><td colspan="8" style="text-align:center;color:#bbb;font-size:11px">Sin registros</td></tr>`;return;}
      const fin=parseFloat((last.ini-last.sale+last.ingresa).toFixed(2));
      const dias=last.sale>0?fin/last.sale:999;
      const st=dias<3?'fail':dias<7?'warn':'ok';
      const pct=Math.min(100,Math.round((dias/30)*100));
      const barC=st==='ok'?'#1D9E75':st==='warn'?'#BA7517':'#E24B4A';
      let dosis=null;
      if(last.sale&&last.caudal_m3){
        let sale_g=q.unit==='kg'?last.sale*1000:q.unit==='L'?last.sale*1000:last.sale;
        const ia=sale_g*(last.conc/100);
        dosis=parseFloat((ia*1000/(last.caudal_m3*1000)).toFixed(1));
      }
      const cm3=last.caudal_m3?parseFloat((last.sale*last.costo_unit/last.caudal_m3).toFixed(0)):null;
      h+=`<tr>
        <td><strong>${q.id}</strong><br><span style="font-size:10px;color:#999">${q.unit}</span></td>
        <td class="r">${fmt(last.ini,1)}</td><td class="r">${fmt(last.sale,1)}</td><td class="r">${last.ingresa>0?'<span style="color:#1D9E75;font-weight:500">+'+fmt(last.ingresa,1)+'</span>':0}</td>
        <td class="r"><span class="fin-val ${st}">${fmt(fin,1)}</span></td>
        <td class="r"><div class="stock-mini"><div class="stock-bar-bg"><div class="stock-bar-fill" style="width:${pct}%;background:${barC}"></div></div><span style="font-size:10px;color:${barC};font-weight:500;min-width:24px">${dias<999?fmt(dias,1):'∞'}d</span></div></td>
        <td class="r"><input class="conc-inp" type="number" step="0.1" value="${last.conc}" onchange="updateConc('${planta}','${q.id}',this.value)"></td>
        <td class="r">${dosis!==null?dosis+'':'—'}</td>
        <td class="r">${cm3!==null?Math.round(cm3).toLocaleString('es-CO'):'—'}</td>
      </tr>`;
    });
    h+=`</tbody></table></div>
    <div class="sec">Registrar movimiento del día</div>
    <div class="form-block">
      <div class="form-grid">
        <div><label>Fecha</label><input type="date" id="qdate-${planta}"></div>
        <div><label>Caudal tratado (m³/d)</label><input type="number" step="any" id="qcaudal-${planta}" placeholder="13.0"></div>
      </div>`;
    quims.forEach(q=>{
      const rows=state.quimicos.filter(r=>r.planta===planta&&r.quimico===q.id);
      const last=rows.length?rows[rows.length-1]:null;
      const ini_sug=last?parseFloat((last.ini-last.sale+last.ingresa).toFixed(2)):0;
      h+=`<div class="subsec">${q.id} (${q.unit}) — inicial sugerido: <strong>${ini_sug}</strong></div>
      <div class="form-grid">
        <div><label>Inicial (${q.unit})</label><input type="number" step="any" id="qini-${planta}-${q.id}" value="${ini_sug}"></div>
        <div><label>Sale (${q.unit})</label><input type="number" step="any" id="qsale-${planta}-${q.id}" placeholder="0"></div>
        <div><label>Ingresa (${q.unit})</label><input type="number" step="any" id="qing-${planta}-${q.id}" placeholder="0"></div>
        <div><label>COP/${q.unit}</label><input type="number" step="any" id="qcosto-${planta}-${q.id}" value="${last?last.costo_unit:q.costo}"></div>
      </div>`;
    });
    h+=`<button class="btn" onclick="saveQuimicos('${planta}')">Guardar ${planta}</button></div></div>`;
  });
  h+=`</div>`;
  cont.innerHTML=h;
  const td=new Date().toISOString().slice(0,10);
  ['PTAP','PTARD'].forEach(p=>{const el=document.getElementById('qdate-'+p);if(el)el.value=td;});
}
function updateConc(planta,qid,val){
  const rows=state.quimicos.filter(r=>r.planta===planta&&r.quimico===qid);
  if(rows.length){rows[rows.length-1].conc=parseFloat(val)||0;renderQuimicos();}
}
function saveQuimicos(planta){
  const dv=document.getElementById('qdate-'+planta).value; if(!dv){alert('Ingresa fecha.');return;}
  const caudal=parseFloat(document.getElementById('qcaudal-'+planta).value)||0;
  QUIMICOS_DEF[planta].forEach(q=>{
    const ini=parseFloat(document.getElementById('qini-'+planta+'-'+q.id).value)||0;
    const sale=parseFloat(document.getElementById('qsale-'+planta+'-'+q.id).value)||0;
    const ingresa=parseFloat(document.getElementById('qing-'+planta+'-'+q.id).value)||0;
    const costo_unit=parseFloat(document.getElementById('qcosto-'+planta+'-'+q.id).value)||q.costo;
    const rows=state.quimicos.filter(r=>r.planta===planta&&r.quimico===q.id);
    const last=rows.length?rows[rows.length-1]:null;
    const conc=last?last.conc:q.conc;
    state.quimicos.push({date:dv,planta,quimico:q.id,ini,sale,ingresa,fin:parseFloat((ini-sale+ingresa).toFixed(3)),conc,costo_unit,caudal_m3:caudal});
    state.quimicos.sort((a,b)=>a.date.localeCompare(b.date));
  });
  renderQuimicos(); ts();
}

    <div class="kpi"><div class="lbl">Abiertas</div><div class="val fail">${ab}</div></div>
    <div class="kpi"><div class="lbl">En proceso</div><div class="val warn">${pr}</div></div>
    <div class="kpi"><div class="lbl">Cerradas</div><div class="val ok">${ce}</div></div>

  if(!fil.length) h+=`<div style="text-align:center;color:#bbb;padding:20px;font-size:12px">Sin novedades.</div>`;
  else [...fil].reverse().forEach(n=>{
    h+=`<div class="nov-card"><div class="nov-top"><div class="badges"><span class="badge ${tb[n.tipo]||''}">${tl[n.tipo]||n.tipo}</span><span class="badge ${pb[n.plant]||''}">${n.plant}</span><span class="badge ${eb[n.estado]||''}">${el2[n.estado]||n.estado}</span></div><span class="nov-date">${n.date}</span></div><div class="nov-desc">${n.desc}</div>${n.accion?`<div class="nov-acc">→ ${n.accion}</div>`:''}</div>`;
  });
  cont.innerHTML=h;
  const eld=document.getElementById('nv-date'); if(eld) eld.value=new Date().toISOString().slice(0,10);

function setNovFil(f){ novFilter=f; renderNovedades(); }
function saveNov(){
  const dv=document.getElementById('nv-date').value; if(!dv){alert('Ingresa fecha.');return;}
  const desc=document.getElementById('nv-desc').value.trim(); if(!desc){alert('Ingresa descripción.');return;}
  state.novedades.push({id:novId++,date:dv,plant:document.getElementById('nv-plant').value,tipo:document.getElementById('nv-tipo').value,desc,accion:document.getElementById('nv-acc').value.trim(),estado:document.getElementById('nv-estado').value});
  state.novedades.sort((a,b)=>a.date.localeCompare(b.date));
  renderNovedades(); ts();
}

function switchTab(t){
  const tabs=['general','ptapd','ptapm','ptard','quimicos','novedades'];
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',tabs[i]===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+t).classList.add('active');
}
